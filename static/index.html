<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASTEIN</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pastey.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0b1326',
                        'surface-container': '#171f33',
                        'surface-container-low': '#131b2e',
                        'surface-container-high': '#222a3d',
                        primary: '#adc6ff',
                        secondary: '#89ceff',
                        'on-surface': '#dae2fd',
                        'on-surface-variant': '#c2c6d6',
                        'outline-variant': '#424754'
                    },
                    fontFamily: {
                        geist: ['Geist', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    borderRadius: {
                        lg: '1rem',
                        xl: '1.5rem',
                        full: '9999px'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-background font-inter text-on-surface flex flex-col" style="height:100vh;overflow:hidden;">
    <header class="border-b border-outline-variant px-6 py-4 shrink-0">
        <div class="max-w-[1200px] mx-auto flex items-center gap-3">
            <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pastey.png" alt="Logo" class="w-8 h-8"/>
            <h1 class="font-geist font-bold text-primary text-xl">PASTEIN</h1>
        </div>
    </header>

    <main id="main-content" class="w-full flex flex-col main-layout" style="height:calc(100vh - 73px);overflow-y:auto;">
        <div class="max-w-[800px] w-full mx-auto px-4">
        <div class="flex flex-col items-center mb-8">
            <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/pastey.webp" alt="PASTEIN" class="w-20 h-20 mb-5">
            <p class="text-center text-on-surface-variant" style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 1.1rem;">&ldquo;a simple notepad for copy-pasted across devices&rdquo;</p>
        </div>
        <div class="mb-4">
            <label class="flex items-center gap-2 text-on-surface-variant text-sm font-mono">
                <span class="material-symbols-outlined text-lg">schedule</span>
                Kedaluwarsa:
                <select id="expiry-select" class="glass-panel px-3 py-1.5 rounded-lg bg-transparent border-none outline-none cursor-pointer font-mono text-sm">
                    <option value="3600">1 Jam</option>
                    <option value="86400" selected>24 Jam</option>
                    <option value="604800">7 Hari</option>
                    <option value="2592000">30 Hari</option>
                    <option value="custom">Custom</option>
                    <option value="0">Permanen</option>
                </select>
            </label>
            <div id="custom-expiry" class="hidden mt-2 ml-8 flex items-center gap-2">
                <input type="number" id="custom-value" min="1" value="1" class="w-20 px-3 py-1.5 rounded-lg bg-surface-container border border-outline-variant text-on-surface font-mono text-sm">
                <select id="custom-unit" class="glass-panel px-3 py-1.5 rounded-lg bg-transparent border-none outline-none cursor-pointer font-mono text-sm">
                    <option value="3600">Jam</option>
                    <option value="86400">Hari</option>
                </select>
            </div>
        </div>

        <div class="flex-1 flex flex-col justify-center"><div id="file-chips" class="flex flex-wrap gap-2 mb-3"></div>

        <div id="drop-zone" class="glass-panel rounded-xl textarea-focus p-3 flex items-end gap-2 transition-all overflow-hidden">
            <button id="attach-btn" class="p-2 rounded-lg hover:bg-surface-container-high transition-colors shrink-0" title="Lampirkan file">
                <span class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors">attach_file</span>
            </button>
            <input type="file" id="file-input" class="hidden" multiple accept="*/*">

            <textarea 
                id="content-input" 
                placeholder="Tempel teks atau file..."
                class="textarea-input flex-1 min-w-0 bg-transparent border-none outline-none resize-none font-mono text-sm text-on-surface placeholder-on-surface-variant/50 min-h-[48px] max-h-[300px] overflow-hidden"
                rows="1"
            ></textarea>

            <button id="submit-btn" class="btn-primary p-3 rounded-full font-geist font-semibold text-sm flex items-center gap-1 transition-all shrink-0"><span class="material-symbols-outlined text-lg">send</span><span class="hidden sm:inline ml-1">Buat</span></button>
        </div>

        <section id="result-section" class="hidden mt-6">
            <div class="glass-panel rounded-xl p-4 flex items-center gap-3">
                <a id="result-url" href="#" target="_blank" class="flex-1 font-mono text-sm text-primary hover:underline truncate"></a>
                <button id="copy-btn" class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">content_copy</span>
                    Copy
                </button>
            </div>
        </section>

        <section id="history-section" class="hidden mt-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-geist font-semibold text-lg text-on-surface">Riwayat</h2>
                <button id="clear-history-btn" class="px-3 py-1 rounded-full border border-outline-variant text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-colors">
                    Hapus semua
                </button>
            </div>
            <div id="history-list" class="space-y-2"></div>
        </section></div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    <script src="/static/app.js"></script>
</body>
</html>
