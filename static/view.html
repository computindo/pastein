<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASTEIN</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pastey.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0b1326',
                        'surface-container': '#171f33',
                        'surface-container-low': '#131b2e',
                        'surface-container-high': '#222a3d',
                        primary: '#adc6ff',
                        secondary: '#89ceff',
                        'on-surface': '#dae2fd',
                        'on-surface-variant': '#c2c6d6',
                        'outline-variant': '#424754'
                    },
                    fontFamily: {
                        geist: ['Geist', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    borderRadius: {
                        lg: '1rem',
                        xl: '1.5rem',
                        full: '9999px'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body class="bg-background min-h-screen font-inter text-on-surface">
    <header class="border-b border-outline-variant px-6 py-4">
        <div class="max-w-[1200px] mx-auto flex items-center gap-3">
            <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pastey.png" alt="Logo" class="w-8 h-8"/>
            <h1 class="font-geist font-bold text-primary text-xl">PASTE-IN</h1>
        </div>
    </header>

    <main class="max-w-[800px] mx-auto px-8 pt-8 pb-12">
        <div id="error-page" class="hidden glass-panel rounded-xl p-8 text-center">
            <span class="material-symbols-outlined text-6xl text-on-surface-variant mb-4">error</span>
            <h2 id="error-title" class="font-geist font-semibold text-2xl mb-2"></h2>
            <p id="error-message" class="text-on-surface-variant mb-6"></p>
            <a href="/" class="btn-primary inline-flex items-center gap-2 px-6 py-2.5 rounded-full font-geist font-semibold text-sm">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </a>
        </div>

        <div id="view-content" class="hidden">
            <div class="glass-panel rounded-xl p-4 mb-4">
                <div class="flex flex-wrap items-center justify-between gap-4 text-sm">
                    <div class="flex items-center gap-4">
                        <span id="info-type" class="px-3 py-1 rounded-lg bg-primary/20 text-primary font-mono font-medium text-xs uppercase"></span>
                        <span id="info-lang-mime" class="text-on-surface-variant font-mono"></span>
                    </div>
                    <div class="flex items-center gap-4 text-on-surface-variant">
                        <span>Dibuat: <span id="info-created"></span></span>
                        <span id="info-expires">Kedaluwarsa: <span id="info-expires-date"></span></span>
                    </div>
                </div>
            </div>

            <div id="content-display" class="glass-panel rounded-xl p-6 min-h-[200px]">
                <pre id="content-pre" class="font-mono text-sm text-on-surface whitespace-pre-wrap break-words overflow-x-auto"></pre>
            </div>

            <div class="flex flex-wrap gap-3 mt-4">
                <button id="copy-link-btn" class="glass-panel px-5 py-2.5 rounded-full font-geist font-medium text-sm flex items-center gap-2 hover:bg-surface-container-high transition-colors">
                    <span class="material-symbols-outlined text-lg">link</span>
                    Copy Link
                </button>
                <button id="copy-content-btn" class="glass-panel px-5 py-2.5 rounded-full font-geist font-medium text-sm flex items-center gap-2 hover:bg-surface-container-high transition-colors">
                    <span class="material-symbols-outlined text-lg">content_copy</span>
                    Copy Isi
                </button>
                <a id="download-btn" class="hidden btn-primary px-5 py-2.5 rounded-full font-geist font-semibold text-sm flex items-center gap-2" download>
                    <span class="material-symbols-outlined text-lg">download</span>
                    Download
                </a>
            </div>
        </div>

        <a href="/" class="inline-flex items-center gap-2 text-on-surface-variant text-sm hover:text-primary transition-colors mt-6">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Buat paste baru
        </a>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    <script src="/static/app.js"></script>
</body>
</html>
